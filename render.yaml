# Render Blueprint for grok2api with an external PostgreSQL database.
# Add GROK2API_POSTGRES_DSN as a secret environment variable in Render.

services:
  - type: web
    name: grok2api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    disk:
      name: grok2api-media
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: TZ
        value: Asia/Shanghai
      - key: GROK2API_POSTGRES_DSN
        sync: false
